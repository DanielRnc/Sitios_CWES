<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" style="background-color: #f8f9fa;">
  <!-- Título -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    PATRÓN MVC - Sistema de Gestión de Tareas
  </text>
  <text x="500" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">
    Flujo completo de una petición en PHP
  </text>
  
  <!-- USUARIO (arriba) -->
  <g id="usuario">
    <rect x="400" y="100" width="200" height="80" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="500" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      👤 USUARIO
    </text>
    <text x="500" y="150" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
      (Navegador Web)
    </text>
    <text x="500" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ecf0f1">
      Ejemplo: Crear nueva tarea
    </text>
  </g>
  
  <!-- Flecha Usuario -> Index -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60" />
    </marker>
  </defs>
  
  <line x1="500" y1="180" x2="500" y2="220" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowblue)"/>
  <text x="520" y="205" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">
    1. Petición HTTP
  </text>
  <text x="520" y="220" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">
    POST index.php?action=guardarTarea
  </text>
  
  <!-- INDEX.PHP (Enrutador) -->
  <g id="enrutador">
    <rect x="350" y="230" width="300" height="100" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="3"/>
    <text x="500" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      📋 INDEX.PHP (Enrutador)
    </text>
    <text x="500" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      Front Controller Pattern
    </text>
    <rect x="360" y="290" width="280" height="30" rx="4" fill="#d35400"/>
    <text x="370" y="310" font-family="Courier, monospace" font-size="11" fill="white">
      switch($action) {
    </text>
    <text x="380" y="322" font-family="Courier, monospace" font-size="10" fill="#ecf0f1">
      case 'guardarTarea': →
    </text>
  </g>
  
  <!-- Flecha Index -> Controlador -->
  <line x1="500" y1="330" x2="500" y2="370" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowblue)"/>
  <text x="520" y="355" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">
    2. Enruta a
  </text>
  
  <!-- CONTROLADOR -->
  <g id="controlador">
    <rect x="350" y="380" width="300" height="120" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
    <text x="500" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      🎮 CONTROLADOR
    </text>
    <text x="500" y="430" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
      TareaController.php
    </text>
    <rect x="360" y="440" width="280" height="50" rx="4" fill="#8e44ad"/>
    <text x="370" y="460" font-family="Courier, monospace" font-size="10" fill="white">
      guardar() {
    </text>
    <text x="380" y="475" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • Valida datos del formulario
    </text>
    <text x="380" y="487" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • Llama al modelo →
    </text>
  </g>
  
  <!-- Flecha Controlador -> Modelo -->
  <line x1="650" y1="440" x2="720" y2="440" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowblue)"/>
  <text x="660" y="430" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">
    3. Usa
  </text>
  
  <!-- MODELO -->
  <g id="modelo">
    <rect x="730" y="380" width="220" height="140" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="3"/>
    <text x="840" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      📊 MODELO
    </text>
    <text x="840" y="430" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
      Tarea.php
    </text>
    <rect x="740" y="440" width="200" height="70" rx="4" fill="#16a085"/>
    <text x="750" y="460" font-family="Courier, monospace" font-size="10" fill="white">
      crear() {
    </text>
    <text x="760" y="475" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • Prepara SQL
    </text>
    <text x="760" y="487" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • Valida datos
    </text>
    <text x="760" y="499" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • INSERT BD →
    </text>
  </g>
  
  <!-- Flecha Modelo -> Base de Datos -->
  <line x1="840" y1="520" x2="840" y2="560" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowblue)"/>
  <text x="850" y="545" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">
    4. Guarda
  </text>
  
  <!-- BASE DE DATOS -->
  <g id="basedatos">
    <ellipse cx="840" cy="610" rx="100" ry="60" fill="#34495e" stroke="#2c3e50" stroke-width="3"/>
    <ellipse cx="840" cy="605" rx="100" ry="10" fill="#2c3e50"/>
    <ellipse cx="840" cy="595" rx="100" ry="10" fill="#34495e"/>
    <text x="840" y="615" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      🗄️ MySQL
    </text>
    <text x="840" y="635" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ecf0f1">
      Base de Datos
    </text>
    <text x="840" y="650" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#95a5a6">
      tabla: tareas
    </text>
  </g>
  
  <!-- Flecha BD -> Modelo (retorno) -->
  <line x1="810" y1="570" x2="810" y2="525" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowgreen)"/>
  <text x="780" y="545" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="end">
    5. OK/Error
  </text>
  
  <!-- Flecha Modelo -> Controlador (retorno) -->
  <line x1="720" y1="460" x2="655" y2="460" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowgreen)"/>
  <text x="690" y="475" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">
    6. Resultado
  </text>
  
  <!-- Flecha Controlador -> Vista -->
  <line x1="350" y1="440" x2="280" y2="440" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowblue)"/>
  <text x="340" y="430" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold" text-anchor="end">
    7. Carga
  </text>
  
  <!-- VISTA -->
  <g id="vista">
    <rect x="50" y="380" width="220" height="140" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="160" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      👁️ VISTA
    </text>
    <text x="160" y="430" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
      mis_tareas.php
    </text>
    <rect x="60" y="440" width="200" height="70" rx="4" fill="#c0392b"/>
    <text x="70" y="460" font-family="Courier, monospace" font-size="10" fill="white">
      &lt;html&gt;
    </text>
    <text x="80" y="475" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • Recibe datos
    </text>
    <text x="80" y="487" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • Genera HTML
    </text>
    <text x="80" y="499" font-family="Courier, monospace" font-size="9" fill="#ecf0f1">
      • Muestra mensaje
    </text>
  </g>
  
  <!-- Flecha Vista -> Usuario (retorno) -->
  <line x1="160" y1="380" x2="160" y2="340" stroke="#27ae60" stroke-width="3"/>
  <line x1="160" y1="340" x2="400" y2="220" stroke="#27ae60" stroke-width="3"/>
  <line x1="400" y1="220" x2="400" y2="180" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowgreen)"/>
  <text x="170" y="260" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">
    8. Respuesta HTML
  </text>
  <text x="170" y="275" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
    Mensaje: "Tarea creada"
  </text>
  
  <!-- LEYENDA -->
  <g id="leyenda">
    <rect x="50" y="700" width="900" height="80" rx="8" fill="white" stroke="#bdc3c7" stroke-width="2"/>
    <text x="60" y="725" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      📚 COMPONENTES DEL PATRÓN MVC:
    </text>
    
    <rect x="60" y="735" width="15" height="15" fill="#e67e22"/>
    <text x="80" y="747" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan font-weight="bold">INDEX.PHP:</tspan> Recibe todas las peticiones y las enruta al controlador correcto
    </text>
    
    <rect x="60" y="755" width="15" height="15" fill="#9b59b6"/>
    <text x="80" y="767" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan font-weight="bold">CONTROLADOR:</tspan> Procesa la lógica de la aplicación y coordina Modelo-Vista
    </text>
    
    <rect x="500" y="735" width="15" height="15" fill="#1abc9c"/>
    <text x="520" y="747" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan font-weight="bold">MODELO:</tspan> Gestiona los datos y la lógica de negocio (BD)
    </text>
    
    <rect x="500" y="755" width="15" height="15" fill="#e74c3c"/>
    <text x="520" y="767" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      <tspan font-weight="bold">VISTA:</tspan> Presenta la información al usuario (HTML)
    </text>
  </g>
  
  <!-- Ventajas del patrón -->
  <g id="ventajas">
    <text x="500" y="795" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      ✨ Separación de responsabilidades • Código mantenible • Reutilizable • Testeable
    </text>
  </g>
  
  <!-- Números de paso en círculos -->
  <circle cx="500" cy="205" r="12" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="500" y="211" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1</text>
  
  <circle cx="500" cy="355" r="12" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="500" y="361" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <circle cx="675" cy="440" r="12" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="675" y="446" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">3</text>
  
  <circle cx="840" cy="545" r="12" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="840" y="551" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">4</text>
  
  <circle cx="810" cy="545" r="12" fill="#27ae60" stroke="white" stroke-width="2"/>
  <text x="810" y="551" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">5</text>
  
  <circle cx="675" cy="460" r="12" fill="#27ae60" stroke="white" stroke-width="2"/>
  <text x="675" y="466" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">6</text>
  
  <circle cx="315" cy="440" r="12" fill="#e74c3c" stroke="white" stroke-width="2"/>
  <text x="315" y="446" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">7</text>
  
  <circle cx="280" cy="250" r="12" fill="#27ae60" stroke="white" stroke-width="2"/>
  <text x="280" y="256" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">8</text>
</svg>