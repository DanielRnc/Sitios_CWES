version: '3.8'

services:
  # Servidor Web (PHP + Apache)
  web:
    image: php:8.2-apache
    container_name: mi_servidor_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html

  # Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: mi_base_datos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mi_proyecto
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mi_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 300M

volumes:
  db_data: