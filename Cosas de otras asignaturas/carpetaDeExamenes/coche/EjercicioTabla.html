<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
    <style>
        table, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
            width: 20px;
            height: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <script>
        let n1 = parseInt(prompt("Dime el numero de filas y columnas"));
        document.write("<table>");
        for (let i = 1; i <= n1; i++) {
            document.write("<tr>");
            for (let j = 1; j <= n1; j++) {
                document.write("<td>&nbsp;</td>");
            }
            document.write("</tr>");
        }
        
        document.write("</table>");
    </script>

</body>
</html>
